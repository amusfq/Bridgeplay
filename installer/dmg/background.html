<!doctype html>
<!-- The Bridgeplay.dmg window background, 660x400. Render with installer/dmg/render-background.sh. --><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(../../app/Sources/BridgeplayUI/Resources/Fonts/geist.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;width:660px;height:400px;overflow:hidden;background:#000}
body{position:relative;font-family:Geist,sans-serif;color:#f5f5f7;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:
 radial-gradient(260px 150px at 330px 200px,rgb(139 123 255/.16),transparent 70%),
 radial-gradient(200px 120px at 250px 230px,rgb(79 179 255/.10),transparent 70%),
 radial-gradient(200px 120px at 420px 170px,rgb(255 122 198/.08),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.035) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.035) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(420px 260px at 330px 200px,#000 20%,transparent 75%)}
.eyebrow{position:absolute;top:34px;width:100%;text-align:center;font:500 10.5px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#86868b}
h1{position:absolute;top:52px;width:100%;margin:0;text-align:center;font-weight:600;font-size:24px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,#8b7bff,#4fb3ff 55%,#ff7ac6);-webkit-background-clip:text;color:transparent}
.slot{position:absolute;top:137px;width:150px;height:150px;border-radius:28px;border:1px solid rgb(255 255 255/.10);background:rgb(255 255 255/.025)}
.a{left:90px}.b{left:420px}
svg{position:absolute;left:0;top:0}
.foot{position:absolute;bottom:26px;width:100%;text-align:center;font:400 11px/1.5 ui-monospace,"SF Mono",Menlo,monospace;color:#86868b}
.foot b{color:#a1a1a6;font-weight:500}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="eyebrow">Install Bridgeplay</div>
<h1>Drag it into <span>Applications</span></h1>
<div class="slot a"></div><div class="slot b"></div>
<svg width="660" height="400" viewBox="0 0 660 400"><defs><linearGradient id="g" x1="262" y1="0" x2="398" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b7bff" stop-opacity=".25"/><stop offset=".55" stop-color="#4fb3ff"/><stop offset="1" stop-color="#ff7ac6"/></linearGradient></defs>
<path d="M262 205 H392" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 9"/>
<path d="M384 196 L396 205 L384 214" fill="none" stroke="#ff7ac6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="foot">Then open <b>Bridgeplay</b> from Applications. The Setup Assistant does the rest.<br>bridgeplay.dev</div>
</body></html>
